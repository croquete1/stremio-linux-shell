<!doctype html>
<html><head><meta charset="utf-8"><title>mini</title>
<style>
body { margin: 0; background: #1b1740; color: #f0f0f0; font: 28px sans-serif; }
h1 { margin: 40px 120px; }
.grid { display: grid; grid-template-columns: repeat(6, 200px); gap: 30px; margin: 0 120px; }
.card { height: 280px; border-radius: 12px; background: #3b5bdb; display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box; }
.card:nth-child(odd) { background: #c2255c; }
.card:hover { background: #2b8a3e; outline: 6px solid #ffd43b; }
.card img { width: 100%; }
</style></head>
<body>
<h1>Deterministic WebKit test page</h1>
<div class="grid" id="g"></div>
<script>
const svg = encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="176" height="120"><rect width="176" height="120" fill="#ffd43b"/><circle cx="88" cy="60" r="40" fill="#e8590c"/></svg>');
const g = document.getElementById('g');
for (let i = 0; i < 36; i++) {
  const c = document.createElement('div'); c.className = 'card';
  c.innerHTML = '<div><img src="data:image/svg+xml,' + svg + '"><div>Item ' + (i + 1) + '</div></div>';
  g.appendChild(c);
}
</script>
</body></html>
